<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../index.css" />
    <link rel="stylesheet" href="../forms/form.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Create Budget</title>
  </head>
  <body>
    <main class="main-content">
      <form class="budget-form" id="budgetForm">
        <div class="form-header">
          <h2>Create Budget</h2>
          <button type="button" class="close-btn" onclick="history.back()">
            <i data-lucide="x" color="#4648d4"></i>
          </button>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select Category</option>
            <option value="Salary">Salary</option>
            <option value="Housing">Housing</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bills">Bills</option>
            <option value="Utilities">Utilities</option>
            <option value="Health">Health</option>
            <option value="Travel">Travel</option>
            <option value="Freelance">Freelance</option>
            <option value="Others">Others</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budget-amount">Budget Amount</label>
          <input
            type="number"
            id="budget-amount"
            placeholder="Enter budget amount"
          />
        </div>

        <div class="form-actions">
          <button type="reset" class="cancel-btn">Cancel</button>

          <button type="submit" class="form-btn">Create Budget</button>
        </div>
      </form>
    </main>

    <script>
      lucide.createIcons();
    </script>
    <script src="../forms/budgetForm.js"></script>
  </body>
</html>
