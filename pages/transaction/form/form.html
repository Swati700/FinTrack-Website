<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../../index.css" />
    <link rel="stylesheet" href="../../Budgets/forms/form.css" />

    <script src="https://unpkg.com/lucide@latest"></script>

    <title>Create Transaction</title>
  </head>

  <body>
    <main class="main-content">
      <form class="goal-form" id="transactionForm">
        <div class="form-header">
          <h2>New Transaction</h2>

          <button type="button" class="close-btn" onclick="history.back()">
            <i data-lucide="x" color="#4648d4"></i>
          </button>
        </div>

        <div class="form-group">
          <label for="transaction-name">Transaction Name</label>

          <input
            type="text"
            id="transaction-name"
            placeholder="e.g. Tech Corp Inc."
          />
        </div>

        <div class="form-group">
          <label for="description">Description</label>

          <input
            type="text"
            id="description"
            placeholder="e.g. Monthly Salary"
          />
        </div>

        <div class="form-group">
          <label for="transaction-category">Category</label>

          <select id="transaction-category">
            <option value="">Select Category</option>

            <option value="Salary">Salary</option>
            <option value="Housing">Housing</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bills">Bills</option>
            <option value="Utilities">Utilities</option>
            <option value="Health">Health</option>
            <option value="Travel">Travel</option>
            <option value="Freelance">Freelance</option>
            <option value="Others">Others</option>
          </select>
        </div>

        <div class="form-group">
          <label for="transaction-amount">Amount</label>

          <input
            type="number"
            id="transaction-amount"
            placeholder="Enter amount"
          />
        </div>

        <div class="form-group">
          <label for="transaction-type">Type</label>

          <select id="transaction-type">
            <option value="">Select Type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <div class="form-group">
          <label for="transaction-date">Date</label>

          <input type="date" id="transaction-date" />
        </div>

        <div class="form-group">
          <label for="payment-method">Payment Method</label>

          <select id="payment-method">
            <option value="">Select Payment Method</option>

            <option value="Direct Deposit">Direct Deposit</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="PayPal">PayPal</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Auto-Pay">Auto-Pay</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="reset" class="cancel-btn">Cancel</button>

          <button type="submit" class="form-btn">Add Transaction</button>
        </div>
      </form>
    </main>

    <script>
      lucide.createIcons();
    </script>

    <script src="./form.js"></script>
  </body>
</html>
